syntax = "proto3";

package cs324a2.coordinator;

option java_multiple_files = true;
option java_package = "com.cs324a2.grpc.coordinator";
option java_outer_classname = "CoordinatorProto";

// Raft-style gRPC term, voting, heartbeat, and replicated job-state contract,
// plus the Assignment-1 unstructured ELECTION/COORDINATOR flood (JAC-based)
// re-expressed over gRPC.
service CoordinatorService {
  // One vote per term. Candidate wins only with a majority of known members.
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);

  // Leader liveness. Also carries the leader identity so followers can detect
  // a second claimant in the same term (split-brain protection).
  rpc LeaderHeartbeat(LeaderHeartbeatRequest) returns (LeaderHeartbeatResponse);

  // Push replication / checkpointing of one job snapshot. Each mutation carries
  // a monotonic progress event number for ordering and recovery.
  rpc ReplicateJobState(ReplicateJobStateRequest) returns (ReplicateJobStateResponse);

  // Client entry point. Followers reject with the current leader hint;
  // only the legitimate leader executes.
  rpc SubmitJob(CoordinatorJobRequest) returns (CoordinatorJobResponse);

  // Observability for tests and operators: term, leader, progress watermark,
  // jobs, task states, results, and progress event numbers.
  rpc GetCoordinatorState(GetCoordinatorStateRequest) returns (GetCoordinatorStateResponse);

  // Real-time job progress for the client GUI. Streams one update per
  // distributed-work mutation (assign/complete/retry/job-done) based on actual
  // completed tasks, not a timer. Works on leaders and followers: followers
  // serve their replicated snapshot so progress survives coordinator failover.
  // The stream completes when the job reaches a terminal state.
  rpc SubscribeJobProgress(JobProgressRequest) returns (stream JobProgressUpdate);

  // ---- Assignment-1 unstructured election over gRPC ----
  // Bidirectional neighbour link for the unstructured overlay.
  // (Suggested §5 Join/AddNeighbour.)
  rpc AddNeighbor(NeighborRequest) returns (NeighborResponse);
  // ELECTION flood (convergecast): returns the best candidate in this
  // node's reached subtree. Duplicate election_ids return duplicate=true.
  // (Suggested §5 Election.)
  rpc PropagateElection(ElectionRequest) returns (ElectionResponse);
  // COORDINATOR flood: informs all reachable workers of the elected leader.
  // (Suggested §5 Coordinator.)
  rpc PropagateCoordinator(CoordinatorAnnounce) returns (CoordinatorAck);
  // Liveness probe. (Suggested §5 Heartbeat/Ping.)
  rpc Ping(PingRequest) returns (PingResponse);
}

enum Operation {
  OPERATION_UNSPECIFIED = 0;
  MAX = 1;
  PRIMESUM = 2;
  PRIMECOUNT = 3;
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_PENDING = 1;
  TASK_RUNNING = 2;
  TASK_COMPLETED = 3;
  TASK_FAILED = 4;
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_ACTIVE = 1;
  JOB_COMPLETED = 2;
  JOB_FAILED = 3;
}

// Wire form of a JobRequest. Numbers use sint32 to match worker.proto.
message JobSpec {
  string job_id = 1;
  Operation operation = 2;
  repeated sint32 numbers = 3;
  sint64 start = 4;
  sint64 end = 5;
  bool has_range = 6;
}

message TaskStateProto {
  string task_id = 1;
  int32 partition_id = 2;
  TaskStatus status = 3;
  int32 attempt = 4;
  int32 assigned_worker_id = 5;
  int64 result_value = 6;
  bool has_result = 7;
  string last_failure = 8;
  // Progress event number of the last mutation of this task.
  int64 progress_index = 9;
  // Partition payload (checkpointed so a successor can resume without the client).
  repeated sint32 numbers = 10;
  sint64 start = 11;
  sint64 end = 12;
  bool has_range = 13;
}

message JobStateProto {
  JobSpec job = 1;
  repeated TaskStateProto tasks = 2;
  JobStatus status = 3;
  int64 result_value = 4;
  bool has_result = 5;
  string error = 6;
  // Highest progress event number touching this job.
  int64 progress_index = 7;
  // Leader term that admitted the job.
  int64 term = 8;
}

message RequestVoteRequest {
  int64 term = 1;
  int32 candidate_id = 2;
  // Candidate's replicated progress watermark; voters prefer up-to-date logs.
  int64 last_progress_index = 3;
}

message RequestVoteResponse {
  int64 term = 1;
  bool vote_granted = 2;
  int32 voter_id = 3;
}

message LeaderHeartbeatRequest {
  int64 term = 1;
  int32 leader_id = 2;
  string leader_host = 3;
  int32 leader_port = 4;
  int64 commit_progress_index = 5;
  // Leader's JAC at send time, so followers learn it for same-term merges
  // and operators can observe it via GetCoordinatorState.
  int32 leader_jac = 6;
}

message LeaderHeartbeatResponse {
  int64 term = 1;
  bool success = 2;
  int32 follower_id = 3;
}

message ReplicateJobStateRequest {
  int64 term = 1;
  int32 leader_id = 2;
  // Global progress event number for this mutation.
  int64 progress_index = 3;
  JobStateProto job_state = 4;
}

message ReplicateJobStateResponse {
  int64 term = 1;
  bool success = 2;
  int32 follower_id = 3;
}

message CoordinatorJobRequest {
  JobSpec job = 1;
}

message CoordinatorJobResponse {
  // True when this node executed the job as leader.
  bool executed = 1;
  int64 term = 2;
  int64 result_value = 3;
  bool has_result = 4;
  string error = 5;
  // Leader hint for NOT_LEADER retries.
  int32 leader_id = 6;
  string leader_host = 7;
  int32 leader_port = 8;
  // Progress event number of the terminal job mutation.
  int64 progress_index = 9;
}

message GetCoordinatorStateRequest {}

message GetCoordinatorStateResponse {
  int64 current_term = 1;
  int32 leader_id = 2;
  bool is_leader = 3;
  int64 commit_progress_index = 4;
  repeated JobStateProto jobs = 5;
  int32 worker_id = 6;
  // JAC durability / observability (§7.3): each node owns its own JAC
  // (survives on the node itself; elections read live values via flood).
  int32 jac = 7;
  int32 jobs_in_current_term = 8;
  int32 leader_jac = 9;
  repeated int32 neighbor_ids = 10;
}

// Subscribes to real-time progress for one job. Empty job_id is rejected.
message JobProgressRequest {
  string job_id = 1;
}
// Per-worker rollup of the tasks currently assigned to that worker.
// worker_id is -1 for tasks not yet assigned to any worker.
message WorkerProgress {
  int32 worker_id = 1;
  int32 total_tasks = 2;
  int32 completed_tasks = 3;
  int32 running_tasks = 4;
  int32 pending_tasks = 5;
  int32 failed_tasks = 6;
}

// One progress event for a job, derived from actual task checkpoints.
message JobProgressUpdate {
  string job_id = 1;
  int32 total_tasks = 2;
  int32 completed_tasks = 3;
  int32 running_tasks = 4;
  int32 pending_tasks = 5;
  int32 failed_tasks = 6;
  // completed_tasks / total_tasks (1.0 when total_tasks == 0).
  double completion_fraction = 7;
  int64 progress_index = 8;
  JobStatus status = 9;
  int64 result_value = 10;
  bool has_result = 11;
  string error = 12;
  // Full checkpoint snapshot so clients can render per-task detail.
  JobStateProto job_state = 13;
  repeated WorkerProgress worker_breakdown = 14;
}

// ---- Unstructured overlay + JAC election (Assignment 1 over gRPC) ----

// Neighbour link request. Carries the caller's endpoint so the link is bilateral.
message NeighborRequest {
  int32 worker_id = 1;
  string host = 2;
  int32 port = 3;
}

message NeighborResponse {
  bool added = 1;
  int32 neighbor_count = 2;
}

// ELECTION flood message. Forwarded to all neighbours except the sender;
// each node returns the best candidate in its reached subtree.
message ElectionRequest {
  string election_id = 1;
  int32 sender_id = 2;
  string sender_host = 3;
  int32 sender_port = 4;
}

// Convergecast reply. duplicate=true means this election_id was already
// processed here, so the caller must ignore best_* fields.
message ElectionResponse {
  bool duplicate = 1;
  int32 best_worker_id = 2;
  int32 best_jac = 3;
  string best_host = 4;
  int32 best_port = 5;
  int64 term = 6;
  int64 best_progress_index = 7;
}

// COORDINATOR announcement flood. Informs every reachable worker of the
// elected leader for the term.
message CoordinatorAnnounce {
  string coordinator_message_id = 1;
  int32 coordinator_id = 2;
  string coordinator_host = 3;
  int32 coordinator_port = 4;
  int32 coordinator_jac = 5;
  int64 term = 6;
  int32 sender_id = 7;
  string sender_host = 8;
  int32 sender_port = 9;
  int64 coordinator_progress_index = 10;
}

message CoordinatorAck {
  bool accepted = 1;
  int64 term = 2;
}

// Liveness probe (suggested §5 Ping).
message PingRequest {
  int32 caller_id = 1;
}

message PingResponse {
  int32 worker_id = 1;
  bool is_leader = 2;
  int64 term = 3;
}
